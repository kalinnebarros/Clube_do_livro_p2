<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Clube das Mais Mais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 Biblioteca do Clube</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="biblioteca.html">Biblioteca</a></li>
                <li><a href="perfil.html">Perfil</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 20px; max-width: 1000px; margin: 0 auto;">
        
        <section id="livros-lidos">
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap;">
                <button id="btn-aba-todos" onclick="alternarAba('todos')" style="padding: 10px 20px; border-radius: 20px; border: none; background: #ef5f81; color: white; font-weight: bold; cursor: pointer;">
                    📚 Todos os Livros
                </button>
                <button id="btn-aba-lidos" onclick="alternarAba('lidos')" style="padding: 10px 20px; border-radius: 20px; border: 1px solid #ef5f81; background: white; color: #ef5f81; font-weight: bold; cursor: pointer;">
                    ✅ Meus Livros Lidos
                </button>
            </div>

            <h3 id="titulo-aba" style="color: #a91739; margin-bottom: 5px;">📖 Todos os Livros do Clube</h3>
            <p id="subtitulo-aba" style="color: #666; font-size: 0.9rem;">Clique nos livros para ler as resenhas ou marque os que você já leu:</p>
            
            <div id="lista-livros-historico">
                </div>
        </section>

        <section id="detalhes-livro" style="display: none;">
            <button onclick="voltarParaLista()" class="btn-voltar" style="background:#ef5f81; color:white; border:none; padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:bold; margin-bottom: 15px;">
                ← Voltar para a estante
            </button>
            <h2 id="nome-livro-selecionado" style="color: #ef5f81; margin-top: 10px;"></h2>
            <div id="resenhas-antigas-container" style="margin-top: 20px;">
                </div>
        </section>

    </main>

    <script type="module" src="biblioteca.js"></script>
</body>
</html>
