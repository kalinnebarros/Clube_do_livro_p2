<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube do Livro | Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast" class="toast"></div>    

    <header>
        <h1>📚🎧☕ Clube do Livro</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="biblioteca.html">Biblioteca</a></li>
                <li><a href="perfil.html">Perfil</a></li>
            </ul>   
        </nav>
    </header>

    <main>
        <section id="hero">
            <h2>Bem-vindo ao Clube das mais mais :)</h2>
            <p>“Uma vida sem leitura é uma vida sem esperança”. — George Orwell</p>
        </section>

        <section id="book-of-the-month">
            <h3>⟶ Livro do Mês</h3>
            <div id="book-display">
                </div>
        </section>  

        <section id="reviews">
            <h3>Resenhas</h3>
            <p>Sinta-se livre para compartilhar suas opiniões!</p>
            
            <div class="review-form">
                <h4 id="livro-atual-resenha" style="color: #a91739; margin-bottom: 10px;">Lendo: Carregando...</h4>
                <textarea id="input-texto" placeholder="O que achou da leitura?"></textarea>
                
                <div class="form-footer" style="display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                    <select id="input-nota" style="padding: 10px; border-radius: 10px; border: 1px solid #eee; background: #fafafa; font-size: 1rem;">
                        <option value="5">⭐⭐⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="1">⭐</option>
                    </select>
                    <button id="btn-publicar" onclick="postarResenha()">Publicar</button>
                </div>
            </div>

            <div id="reviews-container">
                </div>
        </section>
    </main>

    <section id="admin-panel" style="display: none;">
        <h3>⚙️ Painel da Administradora</h3>
    </section>   

    <script type="module" src="script.js"></script> 

    <div id="modal-curtidas" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; width: 90%; max-width: 400px; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; max-height: 80vh; display: flex; flex-direction: column;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">
            <h4 style="margin: 0; color: #ef5f81;">Curtidas ❤️</h4>
            <button onclick="fecharModalCurtidas()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #888;">&times;</button>
        </div>

        <div id="lista-usuarios-curtidas" style="overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px;">
            </div>
    </div>
</div>
</body>
</html>
